name: caspian_owner
description: "Caspian Owner - owners' app for Caspian furniture mall"
publish_to: 'none'

# X.Y.Z+BUILD. BUILD must always increase (Android refuses a lower versionCode).
# Bump with tool/bump_version.ps1, never by hand.
version: 0.2.0+3
environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  clock: 1.1.3
  crypto: 3.0.7
  csv: 8.0.0
  device_info_plus: 13.3.0
  dio: 5.11.1
  drift: 2.35.2
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  freezed_annotation: 3.1.0
  go_router: 18.0.2
  # Version is pinned by flutter_localizations.
  intl: any
  json_annotation: 4.12.0
  local_auth: 3.0.2
  # Persian texts for the Android fingerprint dialog (AndroidAuthMessages).
  local_auth_android: 2.2.0
  material_symbols_icons: 4.2960.0
  package_info_plus: 10.2.2
  path_provider: 2.1.6
  shamsi_date: 1.1.1
  share_plus: 13.3.1
  skeletonizer: 3.0.0
  uuid: 4.6.0
  workmanager: 0.10.10

dev_dependencies:
  alchemist: 0.14.1
  args: 2.7.0
  build_runner: 2.16.2
  drift_dev: 2.35.1
  fake_async: 1.3.3
  # Launcher icon from tool/brand/ (run by hand, see tool/brand/README.md).
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  freezed: 4.0.2
  integration_test:
    sdk: flutter
  json_serializable: 6.14.1
  mocktail: 1.0.5
  very_good_analysis: 11.0.0
  yaml: 3.1.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Mock data in the shape of api/openapi.yaml (used until the server exists).
    - assets/mock/

  fonts:
    # Vazirmatn UI with Farsi digits, v33.003 (SIL OFL 1.1, see assets/fonts/OFL.txt).
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-UI-FD-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-UI-FD-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-UI-FD-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-UI-FD-Bold.ttf
          weight: 700
