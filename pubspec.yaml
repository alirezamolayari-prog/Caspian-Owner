name: caspian_owner
description: "Caspian Owner - owners' app for Caspian furniture mall"
publish_to: 'none'

# X.Y.Z+BUILD. BUILD must always increase (Android refuses a lower versionCode).
# Bump with tool/bump_version.ps1, never by hand.
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Version is pinned by flutter_localizations.
  intl: any
  material_symbols_icons: 4.2960.0
  shamsi_date: 1.1.1

dev_dependencies:
  alchemist: 0.14.1
  flutter_test:
    sdk: flutter
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    # Vazirmatn UI with Farsi digits, v33.003 (SIL OFL 1.1, see assets/fonts/OFL.txt).
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-UI-FD-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-UI-FD-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-UI-FD-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-UI-FD-Bold.ttf
          weight: 700
