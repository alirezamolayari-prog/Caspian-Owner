name: caspian_owner
description: "Caspian Owner - owners' app for Caspian furniture mall"
publish_to: 'none'

# X.Y.Z+BUILD. BUILD must always increase (Android refuses a lower versionCode).
# Bump with tool/bump_version.ps1, never by hand.
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  clock: 1.1.3
  csv: 8.0.0
  drift: 2.35.2
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  freezed_annotation: 3.1.0
  # Version is pinned by flutter_localizations.
  intl: any
  json_annotation: 4.12.0
  material_symbols_icons: 4.2960.0
  shamsi_date: 1.1.1
  uuid: 4.6.0

dev_dependencies:
  alchemist: 0.14.1
  build_runner: 2.16.2
  drift_dev: 2.35.1
  flutter_test:
    sdk: flutter
  freezed: 4.0.2
  json_serializable: 6.14.1
  mocktail: 1.0.5
  very_good_analysis: 11.0.0
  yaml: 3.1.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Mock data in the shape of api/openapi.yaml (used until the server exists).
    - assets/mock/

  fonts:
    # Vazirmatn UI with Farsi digits, v33.003 (SIL OFL 1.1, see assets/fonts/OFL.txt).
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-UI-FD-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-UI-FD-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-UI-FD-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-UI-FD-Bold.ttf
          weight: 700
