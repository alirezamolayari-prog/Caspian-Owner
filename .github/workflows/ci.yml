name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Disable analytics
        run: |
          flutter config --no-analytics
          dart --disable-analytics

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee build-analyze.txt || { grep -E '(error|warning|info) •' build-analyze.txt | head -40 | while read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Test
        run: flutter test --reporter expanded --file-reporter json:build/test-results.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results.json
          if-no-files-found: ignore

      - name: Build debug APK
        run: flutter build apk --debug

      # The same signed release build as release.yml, so a PR can't merge
      # if the real APK would fail (R8, signing, Google SMS library). Uses
      # the existing signing secrets; nothing about signing changes here.
      # Forks and Dependabot get no secrets, so their PRs skip it.
      - name: Restore the release keystore
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Signing secret $name is missing (docs/RELEASING.md)."
              exit 1
            fi
          done
          # Accepts plain base64 or `certutil -encode` output.
          echo "$KEYSTORE_BASE64" | grep -v -- '-----' | tr -d '\r\n ' | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build the signed release APK (universal)
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        run: flutter build apk --release

      - name: Check the release APK is signed with the release key
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $apksigner"
          certs=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          # "Signer #1 certificate DN:" (build-tools 36) or
          # "V2 Signer: certificate DN:" (build-tools 37).
          dn=$(echo "$certs" | grep -E 'Signer.*certificate DN:' || true)
          if [ -z "$dn" ]; then
            echo "$certs"
            echo "::error::apksigner printed no signer certificate."
            exit 1
          fi
          echo "$dn"
          if echo "$dn" | grep -q 'CN=Android Debug'; then
            echo "::error::The release APK is signed with the debug key."
            exit 1
          fi

      - name: Remove the keystore
        if: always()
        run: rm -f android/app/release.jks android/key.properties
