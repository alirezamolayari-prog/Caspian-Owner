name: Release

# Push a tag like v1.2.0 (see docs/RELEASING.md). The phones find the new
# version through update.json on the GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check signing secrets
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Signing secret $name is missing. Add it with 'gh secret set $name' (docs/RELEASING.md). The app must always be signed with the same release key."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v5

      - name: Check the tag matches pubspec.yaml
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\)+[0-9]*.*/\1/p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $version. Run tool/bump_version.ps1 first."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Disable analytics
        run: |
          flutter config --no-analytics
          dart --disable-analytics

      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

      - name: Restore the release keystore
        run: |
          # Accepts plain base64 or `certutil -encode` output.
          echo "$KEYSTORE_BASE64" | grep -v -- '-----' | tr -d '\r\n ' | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build the signed APK (universal)
        run: |
          # One APK for every phone: arm64-v8a, armeabi-v7a and x86_64.
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "caspian-v$VERSION.apk"

      - name: Make update.json
        run: |
          dart run tool/make_update_manifest.dart \
            --apk "caspian-v$VERSION.apk" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/caspian-v$VERSION.apk" \
            --out update.json
          cat update.json

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## $VERSION" 'index($0, v) == 1 {p=1; next} /^## / {p=0} p' docs/CHANGELOG.md > notes.md
          # Size and SHA-256, so a half-finished download (common on Iranian
          # internet; Android then says "package appears to be invalid") can
          # be recognised before trying to install it.
          apk="caspian-v$VERSION.apk"
          bytes=$(stat -c %s "$apk")
          mb=$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1048576 }')
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          {
            echo
            echo "### نصب"
            echo "- فایل \`$apk\` را از پایین همین صفحه (Assets) دانلود کنید."
            echo "- حجم فایل باید دقیقاً **$bytes بایت** (حدود $mb مگابایت) باشد. اگر کمتر است، دانلود نیمه‌کاره مانده و اندروید می‌گوید «بسته نامعتبر است»؛ دوباره دانلود کنید."
            echo "- اگر نسخه‌ای با امضای دیگر روی گوشی هست (مثلاً نسخه آزمایشی)، اول آن را حذف کنید."
            echo "- حداقل اندروید ۷."
            echo
            echo "SHA-256: \`$sha\`"
          } >> notes.md
          cat notes.md
          gh release create "$GITHUB_REF_NAME" \
            "caspian-v$VERSION.apk" update.json \
            --title "Caspian Owner $VERSION" \
            --notes-file notes.md

      - name: Remove the keystore
        if: always()
        run: rm -f android/app/release.jks android/key.properties
